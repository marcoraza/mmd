<title>MMD Estoque Inteligente · codemap</title>
<style>
  @property --ba { syntax:'<angle>'; initial-value:0deg; inherits:false; }
  :root{
    --bg:#0b0b0b; --card:#131313; --muted:#232323; --mfg:#a3a3a3; --fg:#f5f5f5;
    --edge:#3d3d40;
    --shadow: inset 0 1px 0 0 #ffffff08, inset 0 0 0 1px #ffffff08,
              0 0 0 1px #0000001a, 0 2px 2px 0 #0000001a,
              0 4px 4px 0 #0000001a, 0 8px 8px 0 #0000001a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(1400px 800px at 50% 30%, transparent 60%, rgba(0,0,0,.5));}

  header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
    justify-content:space-between;padding:18px 24px;pointer-events:none}
  header>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:34px;height:34px;border-radius:12px;background:var(--card);
    box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden}
  .brand .mark img{width:20px;height:20px}
  .brand h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .hstats{display:flex;align-items:center;gap:10px}
  .compo-wrap{display:flex;align-items:center;gap:11px;height:34px;padding:0 15px;border-radius:999px;
    background:var(--card);box-shadow:var(--shadow)}
  .compo-total{font-size:12px;color:var(--mfg);white-space:nowrap}
  .compo-total b{color:var(--fg);font-weight:600;font-size:13px}
  .compo{display:flex;width:230px;height:9px;border-radius:99px;overflow:hidden;gap:2px}
  .seg{height:100%;min-width:5px;cursor:pointer;border-radius:2px;transition:opacity .2s}
  .hstats.filtering .seg:not(.on){opacity:.25}
  .hpill{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;
    background:var(--card);box-shadow:var(--shadow);font-size:12px;color:var(--mfg);white-space:nowrap}
  .hpill .dotlocal{width:7px;height:7px;border-radius:99px;background:#34d399}

  #stage{position:absolute;inset:0;cursor:grab;overflow:hidden}
  #stage.panning{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
  #edges path{fill:none;stroke:var(--edge);stroke-width:1.4;transition:stroke .2s,opacity .25s}
  #edges path.hl{stroke:#fb923c}
  #edges path.dim{opacity:.1}

  .area{position:absolute;border-radius:30px;background:rgba(255,255,255,.035);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  .area .alabel{position:absolute;top:18px;left:24px;display:flex;align-items:center;gap:7px;
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d}
  .area .alabel i{width:6px;height:6px;border-radius:99px;background:#5b5b5b}

  .pill{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;border-radius:999px;
    background:var(--bg);box-shadow:0 0 0 5px var(--bg);padding:2px 8px;font-size:11px;
    color:rgba(163,163,163,.85);transition:opacity .25s,color .2s;pointer-events:none;z-index:4}
  .pill.hl{color:#fdba74}
  .pill.dim{opacity:.08}

  .node{position:absolute;transition:opacity .3s;cursor:pointer;z-index:3}
  .node.dim{opacity:.25}
  .beam{position:absolute;inset:-1px;border-radius:23px;pointer-events:none}
  .beam::before,.beam::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:conic-gradient(from var(--ba),transparent 0turn,transparent .58turn,
      rgba(249,115,22,.9) .68turn,#fdba74 .73turn,rgba(96,165,250,.8) .78turn,transparent .88turn);
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:beamspin 7s linear infinite}
  .beam::after{filter:blur(8px) brightness(1.3) saturate(1.5);opacity:.3}
  @keyframes beamspin{to{--ba:360deg}}

  .card{position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:22px;
    background:var(--card);box-shadow:var(--shadow);height:100%;transition:box-shadow .2s}
  .node:hover .card,.node.sel .card{box-shadow:var(--shadow),0 0 0 1px rgba(251,146,60,.55)}
  .hdr{display:flex;flex:none;align-items:center;gap:10px;height:56px;padding:0 14px}
  .chip{display:flex;flex:none;width:28px;height:28px;align-items:center;justify-content:center;
    border-radius:10px;overflow:hidden}
  .chip img{width:16px;height:16px}
  .chip svg{width:16px;height:16px}
  .tcol{display:flex;flex-direction:column;min-width:0}
  .t{font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s{font-size:11px;line-height:1.3;color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rows{display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    margin:0 16px;border-top:1px solid var(--muted);padding:10px 0 12px}
  .row{display:flex;max-width:100%;align-items:center;gap:6px;font-size:11px;color:var(--mfg);height:20px}
  .row img,.row svg{width:12px;height:12px;flex:none}

  #pop{position:fixed;z-index:40;width:290px;border-radius:22px;background:var(--card);
    box-shadow:var(--shadow),0 24px 60px rgba(0,0,0,.6);padding:16px;display:none}
  #pop.open{display:block}
  #pop .pk{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  #pop .ph{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  #pop .ph .chip{width:30px;height:30px}
  #pop .pt{font-size:14px;font-weight:600}
  #pop .ps{font-size:11.5px;color:var(--mfg)}
  #pop .pd{font-size:12px;line-height:1.55;color:var(--mfg);margin:10px 0}
  #pop code{display:block;font:10.5px ui-monospace,SFMono-Regular,monospace;color:#fdba74;
    background:var(--bg);border-radius:10px;padding:8px 10px;word-break:break-all;margin-bottom:10px}
  #pop .pc{border-top:1px solid var(--muted);padding-top:9px}
  #pop .pc .cl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6b6b6b;margin-bottom:6px}
  #pop .pc .ci{display:flex;gap:6px;font-size:11.5px;color:var(--mfg);line-height:1.7}
  #pop .pc .ci b{color:#d4d4d4;font-weight:500}
  #pop .x{position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:8px;
    display:grid;place-items:center;color:#6b6b6b;cursor:pointer}
  #pop .x:hover{background:var(--muted);color:var(--fg)}

  .legend{position:fixed;left:24px;bottom:18px;z-index:30;display:flex;gap:3px;align-items:center;
    height:40px;padding:0 6px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
  .legf{display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;
    font-size:11px;color:var(--mfg);cursor:pointer;border:0;background:none;font-family:inherit;
    white-space:nowrap;transition:background .15s,color .15s,opacity .15s}
  .legf:hover{background:var(--muted)}
  .legf i{width:8px;height:8px;border-radius:3px}
  .legf .cnt{font-size:10px;color:#6b6b6b}
  .legf.on{background:var(--muted);color:var(--fg)}
  .legf.on .cnt{color:var(--mfg)}
  .legend.filtering .legf[data-kind]:not(.on){opacity:.4}
  .hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:29;
    font-size:11px;color:#6b6b6b}
  .zoom{position:fixed;right:24px;bottom:18px;z-index:30;display:flex;border-radius:999px;
    background:var(--card);box-shadow:var(--shadow);overflow:hidden}
  .zoom button{width:38px;height:34px;border:0;background:none;color:var(--mfg);font-size:15px;
    cursor:pointer;font-family:inherit}
  .zoom button:hover{background:var(--muted);color:var(--fg)}
</style>
</head>

  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="m21 21-6-6"/></svg>'
};
const fav = d => `<img src="https://www.google.com/s2/favicons?domain=${d}&sz=64" onerror="this.style.display='none'">`;

const KIND = {
  entry:   ['rgba(255,255,255,.06)','#d4d4d4', ICO.bolt,  'entrada'],
  cron:    ['rgba(245,158,11,.1)',  '#fbbf24', ICO.clock, 'worker'],
  agent:   ['rgba(249,115,22,.1)',  '#fb923c', ICO.ghost, 'agente'],
  service: ['rgba(236,72,153,.1)',  '#f472b6', ICO.hex,   'serviço'],
  store:   ['rgba(16,185,129,.1)',  '#34d399', ICO.db,    'dados'],
  external:['rgba(14,165,233,.1)',  '#38bdf8', ICO.bolt,  'externo'],
  tool:    ['rgba(139,92,246,.1)',  '#a78bfa', ICO.tool,  'tools']
};

/* ---------- posicionamento semi-auto ---------- */
const CW=236, CGX=20, CGY=32, APAD=20, AHEAD=46;
const byId={};
NODES.forEach(n=>{
  n.w=CW;
  n.h = 56 + (n.rows ? 10 + n.rows.length*20 + (n.rows.length-1)*6 + 12 : 0);
  byId[n.id]=n;
});
AREAS.forEach(a=>{
  const colsN=a.cols||1;
  const colY=Array(colsN).fill(a.y+AHEAD);
  NODES.filter(n=>n.area===a.id).forEach(n=>{
    const c=Math.min(n.col||0,colsN-1);
    if(n.dy)colY[c]+=n.dy;
    n.x=a.x+APAD+c*(CW+CGX);
    n.y=colY[c];
    colY[c]+=n.h+CGY;
  });
  a.w=APAD*2+colsN*CW+(colsN-1)*CGX;
  a.h=Math.max(...colY)-CGY-a.y+APAD;
});
NODES.forEach(n=>{
  if(n.x===undefined||n.y===undefined)
    console.warn(`codemap: nó "${n.id}" sem posição (area inexistente ou sem x/y)`);
});

/* âncoras para roteamento: rode anchors() no console */
window.anchors = () => {
  const out={};
  NODES.forEach(n=>{
    out[n.id]={x:n.x,y:n.y,w:n.w,h:n.h,cx:n.x+n.w/2,cy:n.y+n.h/2,
      L:[n.x,n.y+n.h/2],R:[n.x+n.w,n.y+n.h/2],T:[n.x+n.w/2,n.y],B:[n.x+n.w/2,n.y+n.h]};
  });
  console.table(Object.fromEntries(Object.entries(out).map(([k,v])=>
    [k,{x:v.x,y:v.y,w:v.w,h:v.h,cy:Math.round(v.cy)}])));
  return JSON.stringify(out);
};

/* ---------- mundo ---------- */
const maxX=Math.max(...AREAS.map(a=>a.x+a.w),...NODES.map(n=>(n.x||0)+n.w));
const maxY=Math.max(...AREAS.map(a=>a.y+a.h),...NODES.map(n=>(n.y||0)+n.h),
  ...EDGES.flatMap(e=>e[2].map(p=>p[1])));
const WORLD_W=maxX+60, WORLD_H=maxY+60;
const world=document.getElementById('world');
world.style.width=WORLD_W+'px'; world.style.height=WORLD_H+'px';
const svg=document.getElementById('edges');
svg.setAttribute('width',WORLD_W); svg.setAttribute('height',WORLD_H);

document.getElementById('title').textContent=META.title;
document.title=META.title;
if(META.iconDomain)document.getElementById('brandicon').src=
  `https://www.google.com/s2/favicons?domain=${META.iconDomain}&sz=64`;
else document.getElementById('brandicon').remove();

AREAS.forEach(a=>{
  const d=document.createElement('div');
  d.className='area';
  d.style.cssText=`left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px`;
  d.innerHTML=`<span class="alabel"><i></i>${a.label}</span>`;
  world.appendChild(d);
});

function roundPath(pts,r=13){
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0), l2=Math.hypot(x2-x1,y2-y1);
    const rr=Math.min(r,l1/2,l2/2);
    const ax=x1-(x1-x0)/l1*rr, ay=y1-(y1-y0)/l1*rr;
    const bx=x1+(x2-x1)/l2*rr, by=y1+(y2-y1)/l2*rr;
    d+=` L ${ax} ${ay} Q ${x1} ${y1} ${bx} ${by}`;
  }
  const e=pts[pts.length-1];
  d+=` L ${e[0]} ${e[1]}`;
  return d;
}
function arrow(pts){
  const [x1,y1]=pts[pts.length-2],[x2,y2]=pts[pts.length-1];
  const l=Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/l, uy=(y2-y1)/l;
  const bx=x2-ux*6.3, by=y2-uy*6.3, px=-uy*3.1, py=ux*3.1;
  return `M ${bx+px} ${by+py} L ${x2} ${y2} L ${bx-px} ${by-py}`;
}
const edgeEls=[];
EDGES.forEach(e=>{
  const [from,to,pts,label,lp]=e;
  if(!byId[from]||!byId[to]){console.warn(`codemap: edge ${from}->${to} com nó inexistente`);return}
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', roundPath(pts)+' '+arrow(pts));
  svg.appendChild(p);
  let pill=null;
  if(label){
    pill=document.createElement('div');
    pill.className='pill'; pill.textContent=label;
    pill.style.cssText=`left:${lp[0]}px;top:${lp[1]}px`;
    world.appendChild(pill);
  }
  edgeEls.push({from,to,p,pill});
});

function chipHtml(n){
  const k=KIND[n.kind];
  const inner = n.domain ? fav(n.domain) : k[2];
  return `<span class="chip" style="background:${n.domain?'rgba(255,255,255,.06)':k[0]};color:${k[1]}">${inner}</span>`;
}
function rowIcon(ic){
  if(Array.isArray(ic)) return fav(ic[1]);
  if(ICO[ic]) return `<span style="display:flex;color:#a3a3a3">${ICO[ic]}</span>`;
  return fav(ic);
}
const nodeEls={};
NODES.forEach(n=>{
  const d=document.createElement('div');
  d.className='node';
  d.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px`;
  const rows = n.rows ? `<div class="rows">${n.rows.map(r=>
    `<span class="row">${rowIcon(r[0])}<span>${r[1]}</span></span>`).join('')}</div>` : '';
  d.innerHTML = `${n.kind==='agent'?'<div class="beam"></div>':''}
    <div class="card"><div class="hdr">${chipHtml(n)}
      <span class="tcol"><span class="t">${n.t}</span><span class="s">${n.s||''}</span></span>
    </div>${rows}</div>`;
  d.addEventListener('mouseenter',()=>focus(n.id));
  d.addEventListener('mouseleave',unfocus);
  d.addEventListener('click',ev=>{ev.stopPropagation();openPop(n)});
  world.appendChild(d);
  nodeEls[n.id]=d;
});

/* ---------- composição + filtros ---------- */
const ORDER=['entry','cron','agent','service','tool','store','external'];
const COUNT={}; NODES.forEach(n=>COUNT[n.kind]=(COUNT[n.kind]||0)+1);
document.getElementById('ntotal').textContent=NODES.length;

document.getElementById('compo').innerHTML =
  ORDER.filter(k=>COUNT[k]).map(k=>
    `<span class="seg" data-kind="${k}" title="${COUNT[k]} ${KIND[k][3]}" style="flex:${COUNT[k]} 0 0;background:${KIND[k][1]}"></span>`).join('');

document.getElementById('legend').innerHTML =
  ORDER.filter(k=>COUNT[k]).map(k=>
    `<button class="legf" data-kind="${k}"><i style="background:${KIND[k][1]}"></i>${KIND[k][3]}<span class="cnt">${COUNT[k]}</span></button>`).join('')
  + `<button class="legf" id="legreset" style="display:none;color:#fb923c">⊘ limpar</button>`;

const filterKinds=new Set();
function passes(n){return filterKinds.size===0||filterKinds.has(n.kind)}
function toggleKind(k){filterKinds.has(k)?filterKinds.delete(k):filterKinds.add(k);applyFilter()}
function applyFilter(){
  const on=filterKinds.size>0;
  document.querySelector('.hstats').classList.toggle('filtering',on);
  document.getElementById('legend').classList.toggle('filtering',on);
  document.querySelectorAll('.seg').forEach(s=>s.classList.toggle('on',filterKinds.has(s.dataset.kind)));
  document.querySelectorAll('.legf[data-kind]').forEach(b=>b.classList.toggle('on',filterKinds.has(b.dataset.kind)));
  NODES.forEach(n=>nodeEls[n.id].classList.toggle('dim',on&&!passes(n)));
  edgeEls.forEach(({from,to,p,pill})=>{
    const vis=passes(byId[from])&&passes(byId[to]);
    p.classList.toggle('dim',on&&!vis);
    if(pill)pill.classList.toggle('dim',on&&!vis);
  });
  document.getElementById('legreset').style.display=on?'':'none';
}
document.querySelectorAll('.seg,.legf[data-kind]').forEach(el=>
  el.addEventListener('click',e=>{e.stopPropagation();toggleKind(el.dataset.kind)}));
document.getElementById('legreset').addEventListener('click',e=>{e.stopPropagation();filterKinds.clear();applyFilter()});

function focus(id){
  const near=new Set([id]);
  edgeEls.forEach(({from,to})=>{if(from===id)near.add(to);if(to===id)near.add(from)});
  NODES.forEach(n=>nodeEls[n.id].classList.toggle('dim',!near.has(n.id)));
  edgeEls.forEach(({from,to,p,pill})=>{
    const on=from===id||to===id;
    p.classList.toggle('hl',on); p.classList.toggle('dim',!on);
    if(pill){pill.classList.toggle('hl',on);pill.classList.toggle('dim',!on)}
  });
}
function unfocus(){
  document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  applyFilter();
}

const pop=document.getElementById('pop');
function openPop(n){
  document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));
  nodeEls[n.id].classList.add('sel');
  const k=KIND[n.kind];
  const conns=[];
  edgeEls.forEach(({from,to},i)=>{
    const lbl=EDGES[i][3];
    if(from===n.id) conns.push(`<div class="ci">→ <b>${byId[to].t}</b>${lbl?' · '+lbl:''}</div>`);
    if(to===n.id) conns.push(`<div class="ci">← <b>${byId[from].t}</b>${lbl?' · '+lbl:''}</div>`);
  });
  const areaLabel=n.area?(AREAS.find(a=>a.id===n.area)||{}).label:'';
  pop.innerHTML=`<div class="x" onclick="closePop()">✕</div>
    <div class="pk" style="color:${k[1]}">${(areaLabel?areaLabel+' · ':'')+k[3]}</div>
    <div class="ph">${chipHtml(n)}<div><div class="pt">${n.t}</div><div class="ps">${n.s||''}</div></div></div>
    ${n.d?`<div class="pd">${n.d}</div>`:''}
    ${n.ref?`<code>${n.ref}</code>`:''}
    ${conns.length?`<div class="pc"><div class="cl">Conexões</div>${conns.join('')}</div>`:''}`;
  const r=nodeEls[n.id].getBoundingClientRect();
  let px=r.right+14, py=r.top;
  if(px+300>innerWidth) px=r.left-304;
  if(px<8) px=8;
  py=Math.min(Math.max(py,80),innerHeight-380);
  pop.style.left=px+'px'; pop.style.top=py+'px';
  pop.classList.add('open');
}
function closePop(){pop.classList.remove('open');document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'))}

let tx=0,ty=0,sc=1;
const stage=document.getElementById('stage');
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}
function fit(){
  sc=Math.min(1,(innerWidth-60)/WORLD_W,(innerHeight-150)/WORLD_H);
  tx=(innerWidth-WORLD_W*sc)/2; ty=84+(innerHeight-160-WORLD_H*sc)/2;
  apply();
}
fit(); addEventListener('resize',fit);
let pan=false,px0,py0;
stage.addEventListener('mousedown',e=>{pan=true;px0=e.clientX;py0=e.clientY;stage.classList.add('panning');closePop()});
addEventListener('mousemove',e=>{if(!pan)return;tx+=e.clientX-px0;ty+=e.clientY-py0;px0=e.clientX;py0=e.clientY;apply()});
addEventListener('mouseup',()=>{pan=false;stage.classList.remove('panning')});
stage.addEventListener('click',closePop);
stage.addEventListener('wheel',e=>{
  e.preventDefault(); closePop();
  const f=e.deltaY<0?1.1:0.9, ns=Math.min(2.5,Math.max(.25,sc*f));
  tx=e.clientX-(e.clientX-tx)*(ns/sc); ty=e.clientY-(e.clientY-ty)*(ns/sc);
  sc=ns; apply();
},{passive:false});
document.getElementById('zi').onclick=()=>{sc=Math.min(2.5,sc*1.2);apply()};
document.getElementById('zo').onclick=()=>{sc=Math.max(.25,sc/1.2);apply()};
document.getElementById('zf').onclick=fit;
</script>
</body>
</html>
