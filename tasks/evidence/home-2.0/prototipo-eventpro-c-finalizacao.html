<!--
  VERSÃO C · LINHA DE FINALIZAÇÃO DO MOCKUP
  Parte do B aprovado, mas usa a barra inferior da Home em todas as áreas.
  Somente este arquivo e seus próximos cortes podem evoluir no gauntlet.
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Pro · C Finalização</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #08090a; }
    #appFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #08090a; }
  </style>
</head>
<body>
  <iframe id="appFrame" title="Versão C em finalização"></iframe>
  <script>
    const appFrame = document.getElementById("appFrame");
    const params = new URLSearchParams(location.search);
    const scene = params.get("scene") || "default";
    const initialTab = ["inicio", "eventos", "catalogo"].includes(params.get("tab"))
      ? params.get("tab")
      : "eventos";

    function baseDocument() {
      return appFrame.contentDocument;
    }

    function eventDocument() {
      return baseDocument()
        ?.getElementById("eventAppFrame")?.contentDocument
        ?.getElementById("sourceFrame")?.contentDocument
        ?.getElementById("previousFrame")?.contentDocument;
    }

    function installHomeDock(attempt = 0) {
      const shellDocument = baseDocument();
      const oldDocument = eventDocument();
      const dock = oldDocument?.querySelector(".dkDock");
      const dockBar = dock?.querySelector(".dkDockBar");
      const reader = dock?.querySelector(".dkRead");
      const tabs = dockBar ? Array.from(dockBar.querySelectorAll(".dkTab")) : [];

      if (!shellDocument?.body || !oldDocument?.head || !dock || !dockBar || tabs.length !== 4) {
        if (attempt < 200) setTimeout(() => installHomeDock(attempt + 1), 60);
        return;
      }

      let style = oldDocument.getElementById("eventProCanonicalHomeDock");
      if (!style) {
        style = oldDocument.createElement("style");
        style.id = "eventProCanonicalHomeDock";
        oldDocument.head.appendChild(style);
      }
      style.textContent = `
        /* C: a barra da Home passa a ser a única navegação inferior.
           Rodadas nesta camada: 1 língua da Home no detalhe; 2 motion só
           transform/opacity; 3 contagem técnica em mono + passo de 58px;
           4 hierarquia interna da contagem; 5 detalhe do evento (ring
           discreto vencedor do gauntlet + 3 ações com peso + zonas 64px
           + fixes de slide de confirmação e saída no tema claro). */
        .dk .dkDock {
          left: 20px !important;
          right: 20px !important;
          bottom: 22px !important;
          height: 62px !important;
          display: block !important;
          pointer-events: none !important;
        }
        .dk .dkDockBar {
          width: 100% !important;
          height: 62px !important;
          max-width: none !important;
          display: flex !important;
          align-items: center !important;
          gap: 0 !important;
          /* Paridade dock · valores computados da Home aprovada. */
          padding: 6px !important;
          border: 1px solid rgba(32, 33, 36, .12) !important;
          border-radius: 32px !important;
          background: rgba(255, 255, 255, .84) !important;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.96), inset 0 0 0 1px rgba(32,33,36,.08), 0 10px 30px rgba(32,33,36,.14) !important;
          backdrop-filter: blur(24px) saturate(1.6) !important;
          -webkit-backdrop-filter: blur(24px) saturate(1.6) !important;
          pointer-events: auto !important;
          /* Rodada 2 · a caixa da barra é fixa em C; max-width e padding não animam. */
          transition: transform 160ms ease !important;
        }
        .dk .dkTab {
          min-height: 51px !important;
          height: 51px !important;
          border-radius: 999px !important;
          gap: 3px !important;
          color: #707279 !important;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important;
          font-size: 9px !important;
          font-weight: 560 !important;
          line-height: 1 !important;
          letter-spacing: 0 !important;
          /* Rodada 2 · a barra só aceita transform e opacity; a cor troca sem transição. */
          transition: transform 180ms ease !important;
        }
        /* Paridade dock · a coluna do Catálogo é 15% mais larga na Home. */
        .dk .dkTab[data-tb="catalogo"], .dk .dkTab[data-aba="catalogo"] { flex: 1.15 1 0% !important; }
        .dk .dkTab:active { transform: translateY(0) scale(.985) !important; transition-duration: 80ms !important; }
        .dk .dkTab.on { color: #fff !important; }
        .dk .dkTab .ic { width: 19px !important; height: 19px !important; }
        .dk .dkTab.home-identify-tab .ic { width: 23px !important; height: 23px !important; }
        .dk .dkTab .lb {
          max-height: 12px !important;
          /* Paridade dock · rótulo em SF 400/-.006em, como a Home computa. */
          font-weight: 400 !important;
          letter-spacing: -.006em !important;
          /* Rodada 2 · o rótulo é estático em C; max-height e margin saem da lista. */
          transition: opacity 160ms ease !important;
        }
        @media (hover: hover) and (pointer: fine) {
          .dk .dkTab:not(.on):hover { background: #eef0f4 !important; color: #34363c !important; }
          .dk .dkTab:hover .ic { transform: translateY(-1px); }
          .dk .dkTab .ic { transition: transform 180ms ease; }
        }
        .dk .dkTab .bdg { display: none !important; }
        .dk .dkLens {
          /* Rodada 2 · a lente continua sendo a mesma mola, agora abaixo de 300ms. */
          transition: transform 260ms cubic-bezier(.32, 1.5, .4, 1) !important;
          top: 5.5px !important;
          bottom: 5.5px !important;
          height: 51px !important;
          border-radius: 999px !important;
          background: #4b6cff !important;
          box-shadow: inset 0 1px rgba(255,255,255,.24), 0 7px 18px rgba(75,108,255,.28) !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
        .dk .dkRead { display: none !important; }
        .dk .scroll, .dk .evtScroll, .dk .gScroll, .dk .hubScroll { padding-bottom: 106px !important; }

        /* Rodada 1 · o detalhe passa a falar a mesma língua da Home.
           Inter Tight fica só no nome do evento; ação, zona, metadado e volta
           usam SF Pro Text/system. O prefixo body vence a camada anterior. */
        body .dk .evtBack,
        body .dk .dkSub,
        body .dk .dkSub b,
        body .dk .hubRow .n,
        body .dk .hubRow .bdg,
        body .dk .r60Row strong,
        body .dk .r60Row.r67 strong,
        body .dk .r60Row .r67v,
        body .dk .r60Row.r67 .r67v {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif !important;
        }
        body .dk .dkNome {
          font-family: "Inter Tight", -apple-system, "SF Pro Text", system-ui, sans-serif !important;
          font-size: 32px !important;
          font-weight: 650 !important;
          line-height: 1.04 !important;
          letter-spacing: -.038em !important;
        }

        /* Um degrau único de UI: volta, ação e zona leem na mesma linha. */
        body .dk .evtBack,
        body .dk .hubRow .n,
        body .dk .r60Row strong,
        body .dk .r60Row.r67 strong {
          font-size: 16px !important;
          font-weight: 400 !important;
          letter-spacing: -.011em !important;
        }
        body .dk .evtBack { margin-left: 6px !important; }

        /* Um degrau único de metadado, sem mono fora de serial e contagem. */
        body .dk .dkSub,
        body .dk .hubRow .bdg {
          font-size: 13px !important;
          font-weight: 400 !important;
          letter-spacing: -.006em !important;
        }
        body .dk .dkSub b { font-weight: 600 !important; }
        /* Rodada 3 · 24/36 é contagem técnica, então lê como uma unidade em mono.
           12px/500/.01em é o mesmo passo de contagem que a Home já usa em .gq,
           então nenhum token novo entra. O b#hdOk continua vivo dentro do span
           e herda a família, para o r55 seguir escrevendo só o número.
           Rodada 4 · a unidade fecha a hierarquia interna copiando a regra
           aprovada da Home: .gq usa 500 em var(--sub) e .gq b usa 600 em
           var(--ink). O realizado vira tinta em 600 e o total fica no cinza
           secundário em 500. Mesmo tamanho, mesma linha, nenhum chip ou fundo.
           Os hex são os mesmos que a folha base já aplica em .dkSub e
           .dkSub b, então nenhum matiz novo entra.
           Sem crase neste bloco: o CSS mora dentro de um template literal. */
        body .dk .dkSub .cntTec {
          font-family: var(--mono) !important;
          font-size: 12px !important;
          font-weight: 500 !important;
          letter-spacing: .01em !important;
          font-variant-numeric: tabular-nums !important;
          white-space: nowrap !important;
          color: #747880 !important;
        }
        body .dk .dkSub .cntTec b,
        body .dk .dkSub .cntTec b#hdOk {
          font-family: inherit !important;
          font-size: inherit !important;
          font-weight: 600 !important;
          color: #202124 !important;
        }
        body .dk .r60Row .r67v,
        body .dk .r60Row.r67 .r67v,
        body .dk .r60Row.chip .r67v.chip {
          font-size: 13px !important;
          font-weight: 500 !important;
          letter-spacing: 0 !important;
          font-variant-numeric: tabular-nums !important;
        }

        /* Uma coluna só: cabeçalho, menu de ação e lista na mesma borda. */
        body .dk .dkHd { margin: 0 16px !important; padding: 2px 0 0 !important; }

        /* Rodada 3 · passo único de 58px computados em ação e zona, e ritmo de 16px.
           O preview desenha o telefone com zoom 0.849, então 58px computados
           rendem 49.2px no PNG, que é o meio da faixa visual de 48-52px de onde
           a GRAMATICA tirou "3 linhas de 49px" e "7 linhas de 49px".
           52px computados rendiam 44.15px e derrubavam a faixa visual.
           O seletor .tileMenu .hubRow entra porque a folha anterior fixa 52px
           com três classes e venceria um seletor mais curto. */
        body .dk .tileMenu .hubRow,
        body .dk .hubRow,
        body .dk .r60Row,
        body .dk .r60Row.r67 {
          min-height: 58px !important;
        }
        /* Rodada 2 · motion do detalhe fica só em transform e opacity.
           Fundo e traço continuam mudando, agora sem transição. */
        body .dk .evtBack { transition: transform 120ms ease !important; }
        body .dk .hubRow .chev,
        body .dk .r60Row .chev { transition: transform 260ms ease !important; }

        body .dk .tileMenu { margin-top: 16px !important; }
        /* .carga é o pai da lista e as margens colapsam: o pai fixa o gap, o filho zera. */
        body .dk .carga { margin-top: 16px !important; }
        body .dk .r60List { margin-top: 0 !important; }
        @media (prefers-reduced-motion: reduce) {
          .dk .dkLens, .dk .dkTab { transition: none !important; }
        }

        /* ================= Rodada 5 · detalhe do evento =================
           Vencedor do gauntlet de detalhe (variante C "Ring discreto" do
           wrapper da rodada 1) assado na camada canônica, mais os fixes de
           slide de confirmação e tela de saída no tema claro.
           Sem crase neste bloco: o CSS mora dentro de um template literal. */

        /* a · Ring discreto no metadado: o motivo do design system em 22px.
           O span .dtRing entra por cirurgia (composeDetailRing) antes do
           .cntTec e o offset acompanha o #hdOk. */
        body .dk .dkSub .dtRing {
          display: inline-flex !important;
          width: 22px !important;
          height: 22px !important;
          vertical-align: middle !important;
          margin: -2px 8px 0 2px !important;
        }
        body .dk .dkSub .dtRing svg { width: 100% !important; height: 100% !important; }
        body .dk .dkSub .dtRing .dtTrk { stroke: #e2e4e8 !important; }
        /* O offset muda sem transição: o arco salta junto com a contagem. */
        body .dk .dkSub .dtRing .dtArc { stroke: var(--acc) !important; transition: none !important; }

        /* b · 3 ações com peso: três cartões concretos de mesma geometria.
           Só CSS; a linha de scan é a que não é QR nem manual. */
        body .dk #tileRow {
          display: grid !important;
          grid-template-columns: 1fr !important;
          gap: 8px !important;
          margin: 16px 16px 0 !important;
          padding: 0 !important;
          background: transparent !important;
          box-shadow: none !important;
          border-radius: 0 !important;
        }
        body .dk #tileRow .hubRow {
          min-height: 54px !important;
          border-radius: 16px !important;
          padding: 0 16px !important;
          border-top: 0 !important;
          transition: transform 120ms ease !important;
        }
        body .dk #tileRow .hubRow:active { transform: scale(.98) !important; }
        body .dk #tileRow .hubRow:not([data-read-qr]):not([data-manual]) {
          background: var(--acc) !important;
          box-shadow: 0 8px 20px rgba(75,108,255,.28) !important;
        }
        body .dk #tileRow .hubRow:not([data-read-qr]):not([data-manual]) .n,
        body .dk #tileRow .hubRow:not([data-read-qr]):not([data-manual]) .hIc { color: #fff !important; }
        body .dk #tileRow .hubRow:not([data-read-qr]):not([data-manual]) .bdg { color: #fff !important; opacity: .75 !important; }
        body .dk #tileRow .hubRow:not([data-read-qr]):not([data-manual]) .chev { stroke: #fff !important; opacity: .8 !important; }
        body .dk #tileRow .hubRow[data-read-qr],
        body .dk #tileRow .hubRow[data-manual] {
          background: #fff !important;
          box-shadow: inset 0 0 0 1px #e3e5e9, 0 1px 2px rgba(32,33,36,.04) !important;
        }
        body .dk #tileRow .hubRow[data-read-qr] .n,
        body .dk #tileRow .hubRow[data-manual] .n {
          font-size: 15px !important;
          font-weight: 500 !important;
          color: #4d5057 !important;
        }
        body .dk #tileRow .hubRow[data-read-qr] .hIc,
        body .dk #tileRow .hubRow[data-manual] .hIc {
          width: 32px !important;
          height: 32px !important;
          border-radius: 10px !important;
          background: #eef0f3 !important;
          color: #4d5057 !important;
        }
        body .dk #tileRow .hubRow[data-read-qr] .chev,
        body .dk #tileRow .hubRow[data-manual] .chev { opacity: .5 !important; }
        @media (hover: hover) and (pointer: fine) {
          body .dk #tileRow .hubRow[data-read-qr]:hover,
          body .dk #tileRow .hubRow[data-manual]:hover { background: #fafafa !important; }
        }

        /* c · Zonas com mais ar: 64px por linha e 24px antes da lista. */
        body .dk .r60Row,
        body .dk .r60Row.r67 { min-height: 64px !important; }
        body .dk .r60Row.r67.full strong { color: #9ba0a8 !important; }
        body .dk .carga { margin-top: 24px !important; }

        /* d · Slide de confirmação acima da zona e no tema claro.
           A régua vive no dock (z-index 30) e a .zone cobria com 96.
           O thumb move por transform inline do r55; a mecânica fica intocada. */
        body .dk .dkDock.regua { z-index: 200 !important; pointer-events: auto !important; }
        body .dk .dkDockBar.isSlide { padding: 6px !important; }
        body .dk .isSlide .sl61 {
          background: transparent !important;
          box-shadow: none !important;
          border-radius: 999px !important;
          overflow: hidden !important;
        }
        body .dk .isSlide .sl61::before { display: none !important; }
        body .dk .isSlide .sl61::after {
          content: "" !important;
          position: absolute !important;
          inset: 0 !important;
          border-radius: 999px !important;
          background: linear-gradient(90deg, rgba(75,108,255,.18), rgba(75,108,255,.04)) !important;
          transform: scaleX(var(--p, 0)) !important;
          transform-origin: left center !important;
        }
        body .dk .isSlide .sl61Lbl {
          color: #6d7179 !important;
          -webkit-text-fill-color: #6d7179 !important;
          font: 500 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif !important;
        }
        body .dk .isSlide .sl61Thumb {
          width: 50px !important;
          border-radius: 50% !important;
          background: var(--acc) !important;
          color: #fff !important;
          box-shadow: 0 6px 16px rgba(75,108,255,.35) !important;
        }

        /* e · Tela de saída confirmada no tema claro (antes herdava o dark
           e ficava branco sobre branco). */
        body .dk .despDone { background: var(--paper) !important; color: var(--ink) !important; }
        body .dk .despDone h1 { color: var(--ink) !important; }
        body .dk .despDone .ddK { color: #7b7f87 !important; }
        body .dk .despDone p { color: #6d7179 !important; }
        body .dk .despDone .ddSelo { color: var(--acc) !important; }
        body .dk .despDone .ddBtns { padding: 0 16px 22px !important; }
        body .dk .despDone .ddBtns button {
          width: 100% !important;
          min-height: 54px !important;
          border: 0 !important;
          border-radius: 16px !important;
          background: var(--acc) !important;
          color: #fff !important;
          font: 600 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif !important;
          box-shadow: 0 8px 20px rgba(75,108,255,.28) !important;
          cursor: pointer !important;
          transition: transform 120ms ease !important;
        }
        body .dk .despDone .ddBtns button:active { transform: scale(.98) !important; }
        /* Se algum estado renderizar um segundo botão, ele lê como secundário. */
        body .dk .despDone .ddBtns button + button {
          margin-top: 8px !important;
          background: #fff !important;
          color: #4d5057 !important;
          box-shadow: inset 0 0 0 1px #e3e5e9 !important;
        }
        @media (prefers-reduced-motion: reduce) {
          .dk #tileRow .hubRow, .dk .despDone .ddBtns button { transition: none !important; }
        }
      `;

      /* Rodada 3 · o metadado nasce como "local · data · <b id="hdOk">24</b>/36 conferidas",
         então o total fica num nó de texto solto e não dá para pintar só com CSS.
         Aqui o par vira um único `.cntTec`, sem tocar no `#hdOk`: o r55 continua
         escrevendo `hdOk.textContent` e o total acompanha. É idempotente. */
      function unifyTechnicalCount() {
        for (const sub of oldDocument.querySelectorAll(".dkSub")) {
          if (sub.querySelector(".cntTec")) continue;
          const okNode = sub.querySelector("#hdOk");
          const tail = okNode?.nextSibling;
          if (!okNode || !tail || tail.nodeType !== 3) continue;
          const split = /^(\s*\/\s*\d+)([\s\S]*)$/.exec(tail.nodeValue);
          if (!split) continue;
          const unit = oldDocument.createElement("span");
          unit.className = "cntTec";
          okNode.parentNode.insertBefore(unit, okNode);
          unit.appendChild(okNode);
          unit.appendChild(oldDocument.createTextNode(split[1].trim()));
          tail.nodeValue = split[2];
        }
      }

      /* Rodada 5 · o ring discreto (vencedor do gauntlet de detalhe) entra no
         metadado antes do .cntTec: mesmo desenho do motivo do design system,
         em 22px. Idempotente, nós com data-dt, guard sem .cntTec/#hdOk.
         O offset acompanha o #hdOk; o observer roda com characterData pra
         pegar o despUpdate escrevendo o número na leitura ao vivo. */
      const DT_RING_VOLTA = 2 * Math.PI * 15.5;
      function composeDetailRing() {
        const cnt = oldDocument.querySelector(".dkSub .cntTec");
        const okNode = oldDocument.getElementById("hdOk");
        if (!cnt || !okNode) return;
        const ok = parseInt(okNode.textContent, 10);
        const par = /(\d+)\s*\/\s*(\d+)/.exec(cnt.textContent || "");
        if (!Number.isFinite(ok) || !par) return;
        const tot = Math.max(1, parseInt(par[2], 10));
        let ring = cnt.parentNode.querySelector(".dtRing");
        if (!ring) {
          ring = oldDocument.createElement("span");
          ring.className = "dtRing";
          ring.dataset.dt = "";
          ring.setAttribute("aria-hidden", "true");
          ring.innerHTML = `
            <svg viewBox="0 0 36 36">
              <circle class="dtTrk" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"></circle>
              <circle class="dtArc" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"
                stroke-linecap="round" transform="rotate(-90 18 18)"
                stroke-dasharray="${DT_RING_VOLTA.toFixed(3)}" stroke-dashoffset="0"></circle>
            </svg>`;
          cnt.parentNode.insertBefore(ring, cnt);
        }
        const arc = ring.querySelector(".dtArc");
        if (arc) {
          const offset = (DT_RING_VOLTA * (1 - Math.max(0, Math.min(1, ok / tot)))).toFixed(3);
          if (arc.getAttribute("stroke-dashoffset") !== offset) {
            arc.setAttribute("stroke-dashoffset", offset);
          }
        }
      }

      function normalizeIdentifyTab() {
        const liveDockBar = oldDocument.querySelector(".dkDockBar");
        const liveTabs = liveDockBar ? Array.from(liveDockBar.querySelectorAll(".dkTab")) : [];
        const identifyTab = liveTabs[3];
        if (!identifyTab) return;
        identifyTab.classList.add("home-identify-tab");
        identifyTab.dataset.homeDestination = "identificar";
        identifyTab.removeAttribute("data-tb");
        identifyTab.removeAttribute("data-aba");
        const identifyLabel = identifyTab.querySelector(".lb");
        const identifyGlyph = identifyTab.querySelector(".g");
        if (identifyLabel?.textContent?.trim() !== "Identificar") {
          identifyLabel.textContent = "Identificar";
        }
        if (identifyGlyph && !identifyGlyph.querySelector(".homeScanIcon")) {
          identifyGlyph.innerHTML = `
            <span class="ic homeScanIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M8 4H5a1 1 0 0 0-1 1v3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7.5 12h9"/>
              </svg>
            </span>`;
        }
      }

      normalizeIdentifyTab();
      unifyTechnicalCount();
      composeDetailRing();
      if (oldDocument.body.dataset.homeDockIdentifyBound !== "true") {
        oldDocument.body.dataset.homeDockIdentifyBound = "true";
        oldDocument.defaultView.addEventListener("click", event => {
          const liveTab = event.target.closest?.(".dkTab");
          if (!liveTab) return;
          const liveDockBar = oldDocument.querySelector(".dkDockBar");
          const liveTabs = liveDockBar ? Array.from(liveDockBar.querySelectorAll(".dkTab")) : [];
          if (liveTabs.indexOf(liveTab) !== 3) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          shellDocument.defaultView.openHistoricalRfid?.();
        }, true);
        /* Rodada 5 · mesmo observer de sempre, agora também compondo o ring;
           characterData entra pro arco seguir o #hdOk na leitura ao vivo. */
        const observer = new MutationObserver(() => { normalizeIdentifyTab(); unifyTechnicalCount(); composeDetailRing(); });
        observer.observe(oldDocument.body, { childList: true, subtree: true, characterData: true });
      }

      if (reader) reader.setAttribute("aria-hidden", "true");
      if (scene === "event-detail" && document.body.dataset.sceneApplied !== scene) {
        const openDetail = oldDocument.querySelector(".ev.on, .ev[data-i=\"0\"]");
        if (oldDocument.querySelector(".evtWrap")) {
          document.body.dataset.sceneApplied = scene;
        } else if (openDetail) {
          openDetail.click();
          if (oldDocument.querySelector(".evtWrap")) document.body.dataset.sceneApplied = scene;
        }
      }
      unifyTechnicalCount();
      composeDetailRing();
      shellDocument.body.dataset.canonicalDock = "home";
      document.body.dataset.snapshot = "eventpro-c-finalizacao";
      document.body.dataset.validation = JSON.stringify({
        version: "C",
        scene,
        canonicalDock: "home",
        detailRound: "rodada5",
        dockTabs: tabs.map(tab => tab.querySelector(".lb")?.textContent?.trim()),
        separateReaderHidden: Boolean(reader && oldDocument.defaultView.getComputedStyle(reader).display === "none"),
        homePreserved: Boolean(shellDocument.getElementById("homeReference")),
        historicalRfidPreserved: Boolean(shellDocument.getElementById("rfidReference"))
      });
    }

    appFrame.addEventListener("load", () => installHomeDock());
    appFrame.src = `prototipo-eventpro-b-isolado.html?copy=C&typography=converged&eventConnection=B&eventRefinement=B&tab=${initialTab}&build=finalizacao-c-v1`;
    installHomeDock();
  </script>
