<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Pro 2.0 · Round 50 · Últimas movimentações</title>
<style>
  :root {
    --sans: "Inter Tight", -apple-system, "SF Pro Text", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --W: 402px;

    /* família 4, travada */
    --paper:  #f6f4f1;
    --paper2: #ecebe9;
    --linha:  #e2e1de;
    --ink:    #171718;
    --ink2:   #4a4a4c;
    --ink3:   #7b7b7e;
    --sub:    #6f6f72;
    --vidro:  rgba(255,255,255,.68);
    --balao:  rgba(18,21,26,.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #08090a; color: #e8eaee; font-family: var(--sans); overflow: hidden; }

  #stage { position: fixed; inset: 0; }
  #phone {
    width: 402px; height: 874px; border-radius: 54px;
    background: #000; border: 1px solid #212327;
    box-shadow: 0 40px 120px rgba(0,0,0,.75), 0 0 0 10px #0e0f11;
    overflow: hidden; position: absolute; top: 50%;
    transform-origin: center;
  }
  #screen { position: absolute; inset: 0; overflow: hidden; }
  #screen.fading { opacity: 0; transition: opacity .16s ease; }

  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 19px 32px 0; font: 600 15px var(--sans); pointer-events: none;
    font-variant-numeric: tabular-nums; color: var(--ink);
    background: linear-gradient(180deg, var(--paper) 60%, transparent);
  }
  .app {
    position: absolute; inset: 0; padding-top: 54px; overflow: hidden;
    display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
  }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding-bottom: 116px; }
  .scroll::-webkit-scrollbar { display: none; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  #picker {
    position: fixed; top: 50%; z-index: 50;
    width: 252px; border-radius: 16px;
    transform: translateY(-50%);
    background: rgba(18,19,21,.94); border: 1px solid #26282c;
    backdrop-filter: blur(16px); box-shadow: 0 16px 44px rgba(0,0,0,.58);
    padding: 12px; user-select: none;
  }
  #picker .idx { font: 500 9px var(--mono); letter-spacing: .12em; color: #676c73; }
  #picker h2 { font: 700 14px var(--sans); letter-spacing: -.02em; margin-top: 2px; }
  #picker p { font: 400 10px/1.42 var(--sans); color: #969ba2; margin-top: 5px; min-height: 43px; }
  #picker .escada { display: flex; gap: 0; margin-top: 8px; height: 18px; border-radius: 6px; overflow: hidden; }
  #picker .escada div { flex: 1; position: relative; }
  #picker .escada div.marcado::after {
    content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px #6f7bd6;
  }
  #picker .escLab { display: flex; justify-content: space-between; font: 400 8px var(--mono); color: #5f646b; margin-top: 3px; }
  #picker .medida { background: #17191c; border-radius: 8px; padding: 7px 8px; margin-top: 7px; }
  #picker .linha { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; font: 500 9px var(--mono); }
  #picker .linha .k { color: #6d737b; }
  #picker .linha .v { color: #c9cfd6; }
  #picker .linha .v.ok { color: #8fd6a4; }
  #picker .linha .v.baixo { color: #e0a96b; }
  #picker .nav { display: flex; gap: 6px; margin-top: 8px; }
  #picker .nav button {
    flex: 1; height: 32px; border-radius: 9px; border: 0;
    background: #24262a; color: #e8eaee; font: 600 13px var(--sans); cursor: pointer;
  }
  #picker .nav button:hover { background: #2e3135; }
  #picker .dots { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
  #picker .dots i { width: 7px; height: 7px; border-radius: 50%; background: #34373c; cursor: pointer; }
  #picker .dots i.on { background: #e8eaee; }
  #picker .profileStateNav {
    display: grid; grid-template-columns: repeat(4,1fr); gap: 3px; margin-top: 8px;
  }
  #picker .profileStateNav button {
    height: 22px; border: 0; border-radius: 6px; cursor: pointer;
    background: #1c1e21; color: #666b72; font: 500 9px var(--mono);
  }
  #picker .profileStateNav button.on { background: #30343a; color: #f1f2f4; }

  /* ---------------- topo ---------------- */
  .pad { padding: 0 22px; }
  .kicker { font: 500 12px var(--sans); color: var(--ink3); }
  .display { font: 600 34px/1.04 var(--sans); letter-spacing: -.045em; margin-top: 7px; }
  .display span { color: var(--ink3); }
  .fatos { font: 400 14px var(--sans); color: var(--ink2); margin-top: 12px; }
  .fatos b { font-weight: 600; color: var(--ink); }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--paper);
        display: grid; place-items: center; font: 600 13px var(--sans); flex: none; margin-top: 3px; cursor: pointer; }

  /* ---------------- mapa ---------------- */
  .mapbox { position: relative; overflow: hidden; touch-action: pan-y; cursor: grab; height: 212px; }
  .trilho { display: flex; width: calc(var(--W) * 3); will-change: transform; }
  .slot { width: var(--W); flex: none; position: relative; }
  .marker { position: absolute; z-index: 3; pointer-events: none; }
  .marker.viaja { transition: left .5s cubic-bezier(.4,.05,.2,1), top .5s cubic-bezier(.4,.05,.2,1); }
  .bA .cap {
    background: var(--balao); backdrop-filter: blur(14px) saturate(1.4);
    border-radius: 8px; padding: 4px 8px; position: relative; z-index: 2;
    font: 600 11px var(--sans); color: #fff; white-space: nowrap;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.26), 0 3px 10px rgba(0,0,0,.3);
  }
  .bA .bico {
    width: 7px; height: 7px; background: var(--balao); backdrop-filter: blur(14px) saturate(1.4);
    transform: rotate(45deg); margin: -4px auto 0; position: relative; z-index: 1;
    box-shadow: inset -.5px -.5px 0 rgba(255,255,255,.22);
  }
  .cap .un { font-weight: 400; opacity: .72; margin-left: 1px; }
  .rota { transition: opacity .34s ease; }

  /* ---------------- agenda ---------------- */
  .sect { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 0 2px; }
  .sect .t { font: 500 12px var(--sans); color: var(--ink3); }
  .sect .a { font: 500 12px var(--sans); color: var(--sub); }
  .ev {
    display: flex; align-items: center; gap: 15px; padding: 13px 12px;
    border-top: 1px solid var(--linha); cursor: pointer; margin: 0 -12px;
    border-radius: 14px; position: relative; transition: background .22s ease;
  }
  .ev .d { font: 500 13px var(--sans); color: var(--ink3); width: 50px; flex: none; }
  .ev .t { font: 500 15px var(--sans); }
  .ev .t.soft { color: var(--ink2); font-weight: 400; }
  .ev .c { font: 400 13px var(--sans); color: var(--sub); margin-left: auto; }
  .ev.on { background: var(--paper2); border-top-color: transparent; }
  .ev.on + .ev { border-top-color: transparent; }
  .ev.on .t { font-weight: 600; }
  .mk-pin { color: var(--ink2); flex: none; display: flex; align-items: center; }

  /* ================= BARRA ================= */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 26px; display: flex; justify-content: center; z-index: 30; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; z-index: 20; pointer-events: none;
          background: linear-gradient(180deg, transparent, var(--paper) 62%); }
  .barra { display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; }
  .tab {
    height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0 13px; flex: none;
    transition: background .28s ease, color .28s ease, padding .34s cubic-bezier(.3,.9,.25,1), box-shadow .28s ease;
    overflow: hidden;
  }
  .tab .rot { display: grid; grid-template-columns: 0fr; opacity: 0;
    transition: grid-template-columns .34s cubic-bezier(.3,.9,.25,1), opacity .22s ease; }
  .tab .rot > i { overflow: hidden; white-space: nowrap; font-style: normal; font: 600 14px var(--sans); padding-left: 8px; }
  .tab.on .rot { grid-template-columns: 1fr; opacity: 1; }
  .tab.on { padding: 0 17px 0 14px; }
  .navCluster, .scanSlot { display: contents; }

  .comVidro .barra {
    background: var(--vidro); backdrop-filter: blur(26px) saturate(1.7);
    box-shadow: 0 12px 30px rgba(20,22,26,.12), inset 0 0 0 .5px rgba(255,255,255,.9), 0 0 0 .5px rgba(20,22,26,.05);
  }
  .semBarra .barra { background: transparent; padding: 0; gap: 10px; }

  /* v1 · mantida: sem cápsula, ativo em tinta cheia */
  .v1 .tab { color: #85858a; }
  .v1 .tab.on { background: var(--ink); color: var(--paper); box-shadow: 0 8px 20px rgba(20,22,26,.22); }

  /* v2 · mantida: vidro, ativo na cor do papel */
  .v2 .tab { color: #6f6f74; }
  .v2 .tab.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 .5px rgba(20,22,26,.07); }

  /* v3 · o mesmo cinza do selecionado na agenda */
  .v3 .tab { color: var(--ink3); }
  .v3 .tab.on { background: var(--paper2); color: var(--ink); box-shadow: inset 0 0 0 .5px rgba(20,22,26,.06); }

  /* v4 · um degrau abaixo: o cinza das hairlines */
  .v4 .tab { color: var(--ink3); }
  .v4 .tab.on { background: #dcdbd8; color: var(--ink); }

  /* v5 · o cinza mais firme que ainda é claro */
  .v5 .tab { color: var(--ink3); }
  .v5 .tab.on { background: #cbcac6; color: var(--ink); }

  /* v6 · lente óptica: profundidade no lugar de outro cinza */
  .v6 .barra {
    position: relative; overflow: hidden;
    background: rgba(255,255,255,.44);
    backdrop-filter: blur(30px) saturate(1.55);
    box-shadow: 0 14px 34px rgba(20,22,26,.13),
      inset 0 0 0 .5px rgba(255,255,255,.94),
      0 0 0 .5px rgba(20,22,26,.06);
  }
  .v6 .barra::before {
    content: ""; position: absolute; left: 24px; right: 24px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
  }
  .v6 .tab { color: #6f6f74; position: relative; }
  .v6 .tab > * { position: relative; z-index: 1; }
  .v6 .tab.on {
    color: var(--ink); background: rgba(255,255,255,.78);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.95),
      inset 0 -8px 16px rgba(226,225,222,.34),
      0 6px 16px rgba(20,22,26,.09);
  }
  .v6 .tab.on::before {
    content: ""; position: absolute; inset: 1px 10px auto; height: 10px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.92), transparent);
    filter: blur(3px);
  }

  /* v7 · cerâmica prensada: um objeto só, seleção em baixo-relevo */
  .v7 .barra {
    background: #ecebe9;
    box-shadow: 0 12px 28px rgba(20,22,26,.12),
      inset 0 1px 0 rgba(255,255,255,.78),
      inset 0 0 0 1px rgba(23,23,24,.045);
  }
  .v7 .tab { color: var(--sub); }
  .v7 .tab.on {
    background: #dcdbd8; color: var(--ink);
    box-shadow: inset 0 2px 5px rgba(23,23,24,.12),
      inset 0 -1px 0 rgba(255,255,255,.72);
  }

  /* v8 · negativo técnico: tinta como trilho, papel como ilha */
  .v8 .barra {
    background: var(--ink);
    box-shadow: 0 14px 30px rgba(20,22,26,.25),
      inset 0 0 0 .5px rgba(255,255,255,.12);
  }
  .v8 .tab { color: #b6b5b2; }
  .v8 .tab.on {
    background: var(--paper); color: var(--ink);
    box-shadow: 0 4px 12px rgba(0,0,0,.28),
      inset 0 0 0 .5px rgba(255,255,255,.8);
  }

  /* v9 · RFID primeiro: navegação quieta, Ler tag como ação física */
  .v9 .barra { background: transparent; padding: 0; gap: 0; }
  .v9 .navCluster {
    display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 999px;
    background: rgba(255,255,255,.68); backdrop-filter: blur(26px) saturate(1.5);
    box-shadow: 0 12px 28px rgba(20,22,26,.11),
      inset 0 0 0 .5px rgba(255,255,255,.92),
      0 0 0 .5px rgba(20,22,26,.05);
  }
  .v9 .scanSlot { display: flex; margin-left: 8px; }
  .v9 .tab { color: var(--ink3); }
  .v9 .navCluster .tab.on { background: var(--paper2); color: var(--ink); }
  .v9 .scanSlot .tab {
    width: 58px; padding: 0; background: var(--ink); color: var(--paper);
    box-shadow: 0 10px 24px rgba(20,22,26,.23);
  }
  .v9 .scanSlot .tab.on { width: auto; padding: 0 17px 0 14px; }

  /* v10 · linha do horizonte: a tela termina na navegação */
  .v10 .dock { padding: 0 0 20px; }
  .v10 .barra {
    width: 100%; justify-content: space-around; gap: 0; padding: 9px 18px 0;
    border-radius: 0; border-top: 1px solid var(--linha);
    background: linear-gradient(180deg, rgba(246,244,241,.94), var(--paper));
    box-shadow: 0 -14px 28px rgba(246,244,241,.92);
  }
  .v10 .tab { color: var(--sub); position: relative; }
  .v10 .tab.on {
    color: var(--ink); background: transparent; transform: translateY(-3px);
  }
  .v10 .tab.on::after {
    content: ""; position: absolute; top: -10px; left: 50%;
    width: 20px; height: 2px; border-radius: 2px;
    background: var(--ink); transform: translateX(-50%);
  }

  /* round 25 · descendentes da opção 9 */
  .v9a .barra, .v9b .barra, .v9c .barra, .v9d .barra, .v9e .barra, .v9f .barra {
    background: transparent; padding: 0; gap: 0;
  }
  .v9a .navCluster, .v9b .navCluster, .v9c .navCluster, .v9d .navCluster, .v9e .navCluster, .v9f .navCluster {
    display: flex; align-items: center; gap: 2px; border-radius: 999px;
    background: rgba(255,255,255,.68); backdrop-filter: blur(26px) saturate(1.5);
    box-shadow: 0 12px 28px rgba(20,22,26,.11),
      inset 0 0 0 .5px rgba(255,255,255,.92),
      0 0 0 .5px rgba(20,22,26,.05);
  }
  .v9a .scanSlot, .v9b .scanSlot, .v9c .scanSlot, .v9d .scanSlot, .v9e .scanSlot, .v9f .scanSlot {
    display: flex;
  }
  .v9a .tab, .v9b .tab, .v9c .tab, .v9d .tab, .v9e .tab, .v9f .tab { color: var(--ink3); }
  .v9a .navCluster .tab.on, .v9b .navCluster .tab.on, .v9c .navCluster .tab.on,
  .v9d .navCluster .tab.on, .v9e .navCluster .tab.on, .v9f .navCluster .tab.on {
    background: var(--paper2); color: var(--ink);
    box-shadow: inset 0 0 0 .5px rgba(20,22,26,.04);
  }
  .actionReader {
    padding: 0; background: var(--ink); color: var(--paper) !important;
    box-shadow: 0 10px 24px rgba(20,22,26,.23);
  }
  .readerWord {
    display: none; font: 600 13px var(--sans); white-space: nowrap; margin-left: 7px;
  }

  /* 9A · mesma altura, ação quadrada */
  .v9a .navCluster { padding: 6px; }
  .v9a .scanSlot { margin-left: 8px; }
  .v9a .actionReader { width: 58px; height: 58px; }

  /* 9B · tudo compacto, ainda acima do touchMin */
  .v9b .navCluster { padding: 4px; }
  .v9b .navCluster .tab { height: 44px; padding-left: 11px; padding-right: 11px; }
  .v9b .navCluster .tab.on { padding-left: 12px; padding-right: 14px; }
  .v9b .navCluster .tab .rot > i { font-size: 13px; padding-left: 7px; }
  .v9b .scanSlot { margin-left: 10px; }
  .v9b .actionReader { width: 52px; height: 52px; }

  /* 9C · ação nomeada e horizontal */
  .v9c .navCluster { padding: 4px; }
  .v9c .navCluster .tab { height: 46px; }
  .v9c .scanSlot { margin-left: 8px; }
  .v9c .actionReader { width: 84px; height: 54px; }
  .v9c .readerWord { display: block; }

  /* 9D · ação elevada para o polegar */
  .v9d .navCluster { padding: 4px 5px; }
  .v9d .navCluster .tab { height: 44px; }
  .v9d .scanSlot { margin-left: 12px; transform: translateY(-4px); }
  .v9d .actionReader { width: 58px; height: 58px; }

  /* 9E · navegação ocupa o trilho, leitor fecha a composição */
  .v9e .dock { padding-left: 18px; padding-right: 18px; }
  .v9e .barra { width: 100%; }
  .v9e .navCluster { flex: 1; justify-content: space-between; padding: 5px 6px; }
  .v9e .navCluster .tab { height: 44px; }
  .v9e .scanSlot { margin-left: 8px; }
  .v9e .actionReader { width: 54px; height: 54px; }

  /* 9F · síntese entre a composição curta e o trilho total */
  .v9f .navCluster {
    width: 270px; justify-content: space-between; padding: 5px 6px;
  }
  .v9f .navCluster .tab { height: 46px; }
  .v9f .scanSlot { margin-left: 8px; }
  .v9f .actionReader { width: 56px; height: 56px; }

  .readerTray {
    position: absolute; z-index: 29; color: var(--paper);
    opacity: 0; pointer-events: none; transform-origin: bottom right;
  }
  .reader-open .readerTray { opacity: 1; pointer-events: auto; }
  .readerTail {
    position: absolute; z-index: 0; overflow: visible;
    color: var(--ink); pointer-events: none;
  }
  .readerTitle {
    position: relative; z-index: 1;
    font: 500 9px var(--mono); letter-spacing: .12em;
    color: #9a9a9d; text-transform: uppercase;
  }
  .readerModes { position: relative; z-index: 1; }
  .readerMode {
    border: 0; color: var(--paper); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    font: 600 14px var(--sans); text-align: left;
  }
  .readerMode span { color: #9a9a9d; font: 500 9px var(--mono); letter-spacing: .08em; }

  /* popup 1 · cometa: uma bolha compacta que nasce do botão */
  .pop1 .readerTray {
    right: 20px; bottom: 104px; width: 244px; padding: 10px;
    border-radius: 26px; background: var(--ink);
    box-shadow: 0 22px 46px rgba(20,22,26,.3), inset 0 0 0 .5px rgba(255,255,255,.12);
    transform: translate(18px,28px) scale(.72) rotate(4deg); filter: blur(3px);
    transition: opacity .18s ease, transform .48s cubic-bezier(.18,1.18,.26,1), filter .28s ease;
  }
  .pop1.reader-open .readerTray { transform: none; filter: none; }
  .pop1 .readerTitle { padding: 4px 8px 8px; }
  .pop1 .readerModes { display: grid; }
  .pop1 .readerMode {
    min-height: 44px; padding: 0 12px; background: transparent;
    border-top: 1px solid rgba(255,255,255,.1);
    transform: translateX(14px); opacity: 0;
    transition: opacity .24s ease, transform .34s cubic-bezier(.2,.9,.2,1);
  }
  .pop1.reader-open .readerMode { transform: none; opacity: 1; }
  .pop1.reader-open .readerMode:nth-child(1) { transition-delay: .09s; }
  .pop1.reader-open .readerMode:nth-child(2) { transition-delay: .14s; }
  .pop1.reader-open .readerMode:nth-child(3) { transition-delay: .19s; }
  .pop1 .readerTail { width: 76px; height: 54px; right: -1px; bottom: -43px; }

  /* popup 2 · stack: três cápsulas pretas em cascata */
  .pop2 .readerTray {
    right: 19px; bottom: 100px; width: 252px; height: 174px;
    transform: translateY(30px) scale(.84);
    transition: opacity .18s ease, transform .42s cubic-bezier(.16,1.1,.24,1);
  }
  .pop2.reader-open .readerTray { transform: none; }
  .pop2 .readerTitle { display: none; }
  .pop2 .readerModes { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pop2 .readerMode {
    height: 50px; padding: 0 16px; border-radius: 999px; background: var(--ink);
    box-shadow: 0 12px 26px rgba(20,22,26,.22), inset 0 0 0 .5px rgba(255,255,255,.1);
    opacity: 0; transform: translate(22px,20px) scale(.72) rotate(6deg);
    transition: opacity .2s ease, transform .45s cubic-bezier(.16,1.15,.24,1);
  }
  .pop2 .readerMode:nth-child(1) { width: 100%; }
  .pop2 .readerMode:nth-child(2) { width: 88%; }
  .pop2 .readerMode:nth-child(3) { width: 76%; }
  .pop2.reader-open .readerMode { opacity: 1; transform: none; }
  .pop2.reader-open .readerMode:nth-child(1) { transition-delay: .13s; }
  .pop2.reader-open .readerMode:nth-child(2) { transition-delay: .08s; }
  .pop2.reader-open .readerMode:nth-child(3) { transition-delay: .03s; }
  .pop2 .readerTail { width: 82px; height: 58px; right: -3px; bottom: -36px; }

  /* popup 3 · órbita: ações distribuídas numa curva magnética */
  .pop3 .readerTray {
    right: 6px; bottom: 82px; width: 286px; height: 210px;
    transform: scale(.72) rotate(8deg);
    transition: opacity .2s ease, transform .52s cubic-bezier(.16,1.18,.24,1);
  }
  .pop3.reader-open .readerTray { transform: none; }
  .pop3 .readerTitle { display: none; }
  .pop3 .readerModes { width: 100%; height: 100%; }
  .pop3 .readerModes::before {
    content: ""; position: absolute; right: 22px; bottom: 8px;
    width: 172px; height: 132px; border: 13px solid var(--ink);
    border-left-color: transparent; border-top-color: transparent;
    border-radius: 50%; transform: rotate(-17deg);
  }
  .pop3 .readerMode {
    position: absolute; height: 48px; padding: 0 16px; border-radius: 999px;
    background: var(--ink); box-shadow: 0 12px 26px rgba(20,22,26,.22);
    opacity: 0; transform: scale(.6);

function unitProfileData(item) {
  const index = Math.max(0, DEMO_EQUIPMENT.findIndex(x => x.codigo === item.codigo));
  const prefix = item.codigo.split("-")[1];
  const number = Number(item.codigo.split("-").at(-1));
  const brands = {
    ILU:["Chauvet", "Rogue R2 Wash"], AUD:["Shure", "SM58"],
    CAB:["Wireconex", item.nome], ENE:["Stanley", item.nome],
    EST:["Feeling", item.nome], EFE:["Haze Pro", item.nome],
    VID:["Novastar", item.nome]
  };
  const [marca, modelo] = brands[prefix] || ["MMD", item.nome];
  const desgaste = 3 + (index % 3);
  const estado = desgaste === 5 ? "Semi-novo" : "Usado";
  const original = 2800 + number * 37;
  const atual = Math.round(original * (desgaste / 5) * (estado === "Semi-novo" ? .85 : .65));
  return {
    ...item,
    categoria: equipmentCategory(item),
    tag: String(index + 1).padStart(3, "0"),
    rfid: `E280-1170-${String(number * 29).padStart(6, "0")}`,
    marca,
    modelo,
    serial: `SN-${prefix}-${String(24000 + number * 17).padStart(6, "0")}`,
    status: index % 7 === 6 ? "Em manutenção" : "Disponível",
    local: index % 7 === 6 ? "Bancada técnica" : "Galpão MMD · setor B",
    estado,
    desgaste,
    original,
    atual,
    nota: index % 4 === 0
      ? "Revisado após a última saída. Conectores, fixação e alimentação testados."
      : "Sem observações operacionais nesta unidade."
  };
}

const hex2rgb = (h) => {
  h = h.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
};
const lum = (rgb) => {
  const [r, g, b] = rgb.map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * r + .7152 * g + .0722 * b;
};
const contraste = (a, b) => {
  const l1 = lum(hex2rgb(a)), l2 = lum(hex2rgb(b));
  return (Math.max(l1, l2) + .05) / (Math.min(l1, l2) + .05);
};

function ligarArrasto() {
  const box = screen.querySelector("#mapbox");
  const trilho = screen.querySelector("#trilho");
  if (!box || !trilho) return;
  let x0 = 0, dx = 0, arrastando = false, ultimoX = 0, ultimoT = 0, vel = 0;
  const setT = (px, anim) => {
    trilho.style.transition = anim ? "transform .34s cubic-bezier(.25,.9,.25,1)" : "none";
    trilho.style.transform = `translateX(${-W + px}px)`;
  };
  box.addEventListener("pointerdown", (e) => {
    if (busy) return;
    arrastando = true; x0 = e.clientX; dx = 0; ultimoX = e.clientX; ultimoT = performance.now(); vel = 0;
    box.setPointerCapture(e.pointerId); trilho.style.transition = "none";
  });
  box.addEventListener("pointermove", (e) => {
    if (!arrastando) return;
    dx = e.clientX - x0;
    const t = performance.now();
    if (t > ultimoT) { vel = (e.clientX - ultimoX) / (t - ultimoT); ultimoX = e.clientX; ultimoT = t; }
    setT(dx, false);
  });
  const soltar = () => {
    if (!arrastando) return;
    arrastando = false;
    const passo = (Math.abs(dx) > 90 || Math.abs(vel) > .55) ? (dx < 0 ? 1 : -1) : 0;
    if (passo) { busy = true; setT(passo > 0 ? -W : W, true); setTimeout(() => { sel = wrap(sel + passo); paint(); busy = false; }, 320); }
    else setT(0, true);
  };
  box.addEventListener("pointerup", soltar);
  box.addEventListener("pointercancel", soltar);
  box.addEventListener("pointerleave", soltar);
}

function setDrawerFrame(drawer, backdrop, clientY) {
  const distance = drawer.offsetHeight + 24;
  const translateY = Math.max(0, Math.min(distance, clientY));
  const progress = 1 - translateY / distance;
  drawer.style.transform = `translate3d(0,${translateY}px,0)`;
  if (backdrop) backdrop.style.opacity = String(progress);
  return { distance, translateY, progress };
}

function clearDrawerFrame(drawer, backdrop) {
  drawer.style.transform = "";
  drawer.style.transition = "";
  if (backdrop) {
    backdrop.style.opacity = "";
    backdrop.style.transition = "";
  }
}

function ligarDrawerDrag() {
  const surface = screen.querySelector("[data-reader-surface]");
  const drawer = surface?.querySelector(".inventoryDrawer");
  const backdrop = surface?.querySelector(".drawerBackdrop");
  const handle = drawer?.querySelector("[data-drawer-handle]");
  if (!surface || !drawer || !handle) return;

  let startY = 0, lastY = 0, lastT = 0, deltaY = 0, velocity = 0;
  let dragging = false, pointerOwned = false, touchOwned = false;
  let lastTapAt = 0;
  let settleTimer = null;
  const begin = (clientY) => {
    if (!readerListOpen || dragging) return false;
    clearTimeout(settleTimer);
    settleTimer = null;
    dragging = true;
    startY = lastY = clientY;
    lastT = performance.now();
    deltaY = velocity = 0;
    const currentTransform = getComputedStyle(drawer).transform;
    if (currentTransform !== "none") drawer.style.transform = currentTransform;
    drawer.style.transition = "none";
    return true;
  };
  const move = (clientY) => {
    if (!dragging) return;
    const now = performance.now();
    deltaY = clientY - startY;
    if (now > lastT) velocity = (clientY - lastY) / (now - lastT);
    lastY = clientY;
    lastT = now;
    setDrawerFrame(drawer, backdrop, deltaY);
  };
  const settle = (dismiss) => {
    if (!dragging) return;
    clearTimeout(settleTimer);
    settleTimer = null;
    dragging = false;
    const distance = drawer.offsetHeight + 24;
    const targetY = dismiss ? distance : 0;
    const remaining = dismiss ? distance - Math.max(0, deltaY) : Math.max(0, deltaY);
    const duration = Math.max(180, Math.min(460,
      220 + remaining / distance * 240 - Math.min(90, Math.abs(velocity) * 80)
    ));
    surface.classList.remove("drawer-interacting");
    drawer.style.transition = `transform ${duration}ms cubic-bezier(.22,.78,.18,1)`;
    if (backdrop) backdrop.style.transition = `opacity ${Math.min(duration, 300)}ms cubic-bezier(.22,.78,.18,1)`;
    setDrawerFrame(drawer, backdrop, targetY);
    if (dismiss) readerListOpen = false;
    settleTimer = setTimeout(() => {
      settleTimer = null;
      if (dismiss) {
        surface.classList.remove("list-open");
      }
      clearDrawerFrame(drawer, backdrop);
    }, duration);
  };
  const release = () => {
    if (!dragging) {
      pointerOwned = false;
      return;
    }
    const now = performance.now();
    const isTap = Math.abs(deltaY) < 8 && Math.abs(velocity) < .2;
    const isDoubleTap = isTap && now - lastTapAt <= 320;
    lastTapAt = isTap && !isDoubleTap ? now : 0;
    const projected = deltaY + Math.max(0, velocity) * 140;
    settle(isDoubleTap || deltaY > 88 || velocity > .55 || projected > 118);
    pointerOwned = false;
  };

  handle.addEventListener("pointerdown", (event) => {
    if (!begin(event.clientY)) return;
    pointerOwned = true;
    surface.classList.add("drawer-interacting");
    try { handle.setPointerCapture(event.pointerId); } catch {}
    event.preventDefault();
  });
  handle.addEventListener("pointermove", (event) => {
    if (pointerOwned) move(event.clientY);
  });
  handle.addEventListener("pointerup", release);
  handle.addEventListener("pointercancel", () => { pointerOwned = false; settle(false); });
  handle.addEventListener("dblclick", (event) => {
    if (!readerListOpen || dragging) return;
    event.preventDefault();
    dragging = true;
    deltaY = velocity = 0;
    settle(true);
  });

  handle.addEventListener("mousedown", (event) => {
    if (pointerOwned || !begin(event.clientY)) return;
    event.preventDefault();
  });
  drawer.addEventListener("mousemove", (event) => {
    if (!pointerOwned) move(event.clientY);
  });
  drawer.addEventListener("mouseup", () => {
    if (!pointerOwned) release();
  });
  handle.addEventListener("touchstart", (event) => {
    if (pointerOwned || !begin(event.touches[0].clientY)) return;
    touchOwned = true;
    event.preventDefault();
  }, { passive:false });
  handle.addEventListener("touchmove", (event) => {
    if (!touchOwned) return;
    move(event.touches[0].clientY);
    event.preventDefault();
  }, { passive:false });
  handle.addEventListener("touchend", () => {
    if (!touchOwned) return;
    touchOwned = false;
    release();
  });
  handle.addEventListener("touchcancel", () => {
    touchOwned = false;
    settle(false);
  });
  handle.ondragstart = (event) => {
    if (!begin(event.clientY)) return;
    event.dataTransfer?.setData("text/plain", "drawer");
  };
  handle.ondrag = (event) => {
    if (event.clientY > 0) move(event.clientY);
  };
  handle.ondragend = (event) => {
    if (event.clientY > 0) move(event.clientY);
    release();
  };
}

function ligarPeekDrag() {
  const surface = screen.querySelector("[data-reader-surface]");
  const drawer = surface?.querySelector(".inventoryDrawer");
  const backdrop = surface?.querySelector(".drawerBackdrop");
  const trigger = surface?.querySelector(".listPeek[data-reader-list]");
  if (!surface || !drawer || !trigger) return;

  let startY = 0, lastY = 0, lastT = 0, deltaY = 0, velocity = 0;
  let dragging = false, pointerId = null;
  const distance = () => drawer.offsetHeight + 24;

  const begin = (event) => {
    if (readerListOpen) return;
    startY = lastY = event.clientY;
    lastT = performance.now();
    deltaY = velocity = 0;
    pointerId = event.pointerId;
    try { trigger.setPointerCapture(pointerId); } catch {}
  };
  const move = (event) => {
    if (pointerId === null) return;
    const now = performance.now();
    deltaY = event.clientY - startY;
    if (now > lastT) velocity = (event.clientY - lastY) / (now - lastT);
    lastY = event.clientY;
    lastT = now;
    if (!dragging && deltaY > -4) return;
    if (!dragging) {
      dragging = true;
      trigger.dataset.gestureConsumed = "true";
      readerListOpen = true;
      surface.classList.add("list-open", "drawer-interacting");
      drawer.style.transition = "none";
    }
    setDrawerFrame(drawer, backdrop, distance() + deltaY);
    event.preventDefault();
  };
  const release = () => {
    if (pointerId === null) return;
    pointerId = null;
    if (!dragging) return;
    dragging = false;
    const open = -deltaY > distance() * .2 || velocity < -.42;
    const targetY = open ? 0 : distance();
    const currentY = Math.max(0, Math.min(distance(), distance() + deltaY));
    const remaining = Math.abs(targetY - currentY);
    const duration = Math.max(180, Math.min(460,
      220 + remaining / distance() * 240 - Math.min(90, Math.abs(velocity) * 80)
    ));
    surface.classList.remove("drawer-interacting");
    drawer.style.transition = `transform ${duration}ms cubic-bezier(.22,.78,.18,1)`;
    if (backdrop) backdrop.style.transition = `opacity ${Math.min(duration, 300)}ms cubic-bezier(.22,.78,.18,1)`;
    setDrawerFrame(drawer, backdrop, targetY);
    readerListOpen = open;
    setTimeout(() => { delete trigger.dataset.gestureConsumed; }, 0);
    setTimeout(() => {
      if (!open) surface.classList.remove("list-open");
      clearDrawerFrame(drawer, backdrop);
    }, duration);
  };

  trigger.addEventListener("pointerdown", begin);
  trigger.addEventListener("pointermove", move);
  trigger.addEventListener("pointerup", release);
  trigger.addEventListener("pointercancel", release);
}

function show(i) {

  sel = 0; aba = "eventos"; busy = false; readerOpen = false;

  readerListOpen = true;
  readerCount = DEMO_EQUIPMENT.length;
  itemProfileOpen = true;
  selectedEquipment = null;
  profileResumeScanning = false;
  profileReturnListOpen = true;
  profileDataState = "data";
  const o = OPCOES[cur];

  setTimeout(() => {
    paint();
    screen.classList.remove("fading");

  }

  if (o.trigger) {

      <div class="linha"><span class="k">conteúdo</span><span class="v">${o.conteudo}</span></div>

      <div class="linha"><span class="k">gesto</span><span class="v">${o.gesto}</span></div>`;

  }

  if (o.profile) {
    pMedida.innerHTML = `
      <div class="linha"><span class="k">hierarquia</span><span class="v">${o.hierarquia}</span></div>
      <div class="linha"><span class="k">abertura</span><span class="v">${o.abertura}</span></div>
      <div class="linha"><span class="k">tipografia</span><span class="v">${o.tipografia}</span></div>
      <div class="linha"><span class="k">densidade</span><span class="v">${o.densidade}</span></div>`;
    return;
  }

  if (o.list) {
    pMedida.innerHTML = `
      <div class="linha"><span class="k">abertura</span><span class="v">${o.abertura}</span></div>
      <div class="linha"><span class="k">tipografia</span><span class="v">${o.tipografia}</span></div>
      <div class="linha"><span class="k">ritmo</span><span class="v">${o.ritmo}</span></div>
      <div class="linha"><span class="k">superfície</span><span class="v">${o.superficie}</span></div>`;
    return;
  }

  if (o.popup) {
    pMedida.innerHTML = `
      <div class="linha"><span class="k">forma</span><span class="v">${o.forma}</span></div>
      <div class="linha"><span class="k">motion</span><span class="v">${o.motion}</span></div>
      <div class="linha"><span class="k">cauda</span><span class="v">${o.cauda}</span></div>
      <div class="linha"><span class="k">leitura</span><span class="v">${o.leitura}</span></div>`;
    return;
  }

  if (o.proporcao) {
    pMedida.innerHTML = `
      <div class="linha"><span class="k">proporção</span><span class="v">${o.proporcao}</span></div>
      <div class="linha"><span class="k">navegação</span><span class="v">${o.nav}</span></div>

    return;
  }

  const cTexto = contraste(o.fg, o.ativo);
  const cIcone = contraste(o.off, o.fundo);

screen.addEventListener("click", (ev) => {
  const profileState = ev.target.closest("[data-profile-state]");
  if (profileState) {
    profileDataState = profileState.dataset.profileState;
    paint();
    return;
  }
  const profileBack = ev.target.closest("[data-profile-back]");
  if (profileBack) {
    itemProfileOpen = false;
    readerListOpen = profileReturnListOpen;
    const surface = screen.querySelector("[data-reader-surface]");
    surface?.classList.remove("profile-open");
    surface?.classList.toggle("list-open", readerListOpen);
    if (profileResumeScanning) startReaderDemo(false);
    return;
  }
  const equipmentRow = ev.target.closest("[data-equipment-code]");
  if (equipmentRow) {
    const equipment = DEMO_EQUIPMENT.find(item => item.codigo === equipmentRow.dataset.equipmentCode);
    if (!equipment) return;
    profileReturnListOpen = readerListOpen;
    profileResumeScanning = readerScanning;
    stopReaderDemo();
    selectedEquipment = equipment;
    itemProfileOpen = true;
    paint();
    return;
  }
  const closeReader = ev.target.closest("[data-reader-close]");
  if (closeReader) {
    stopReaderDemo();
    readerScreenOpen = false;
    readerListOpen = false;
    const surface = screen.querySelector("[data-reader-surface]");
    const drawer = surface?.querySelector(".inventoryDrawer");
    const backdrop = surface?.querySelector(".drawerBackdrop");
    surface?.classList.remove("list-open", "drawer-interacting");
    if (drawer) clearDrawerFrame(drawer, backdrop);
    surface?.classList.remove("is-open");
    clearTimeout(readerCloseTimer);
    readerCloseTimer = setTimeout(() => {
      screen.querySelector(".app")?.classList.remove("reader-screen-open");
      readerCloseTimer = null;
    }, 560);
    return;
  }
  const listToggle = ev.target.closest("[data-reader-list]");
  if (listToggle) {
    if (listToggle.dataset.gestureConsumed === "true") {
      delete listToggle.dataset.gestureConsumed;
      return;
    }
    readerListOpen = !readerListOpen;
    screen.querySelector("[data-reader-surface]")?.classList.toggle("list-open", readerListOpen);
    return;
  }
  const reader = ev.target.closest("[data-reader]");
  if (reader) {
    clearTimeout(readerCloseTimer);
    readerCloseTimer = null;
    readerScreenOpen = true;
    readerListOpen = false;
    screen.querySelector(".app")?.classList.add("reader-screen-open");
    const surface = screen.querySelector("[data-reader-surface]");
    surface?.classList.add("is-open");
    surface?.classList.remove("list-open");
    startReaderDemo(true);
    return;
  }
  const t = ev.target.closest("[data-aba]");
  if (t) {
    aba = t.dataset.aba;
    readerOpen = false;
    screen.querySelector(".app")?.classList.remove("reader-open");
    screen.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.aba === aba));
    return;
  }
  const hit = ev.target.closest("[data-i]");
  if (!hit || busy) return;
  const i = Number(hit.dataset.i);
  if (Number.isNaN(i) || i === sel) return;
  busy = true;
  const central = screen.querySelectorAll(".slot")[1];
  const mk = central.querySelector(".marker");
  const rota = central.querySelector(".rota");
  const V = geo(i), e = EVENTOS[i];
  mk.classList.add("viaja");
  mk.style.left = V.c * 100 + "%"; mk.style.top = V.d * 100 + "%";
  mk.querySelector(".cap").innerHTML = `${e.km}<span class="un"> km</span>`;
  if (rota) rota.style.opacity = "0";
  setTimeout(() => { sel = i; paint(); busy = false; }, 320);
});

document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
pDots.addEventListener("click", (event) => {
  const dot = event.target.closest("[data-option]");
  if (dot) show(Number(dot.dataset.option));
});
profileStateNav.addEventListener("click", (event) => {
  const state = event.target.closest("[data-profile-state]");
  if (!state) return;
  profileDataState = state.dataset.profileState;
  paint();
});
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") show(cur - 1);
  if (e.key === "ArrowRight") show(cur + 1);
});

function fit() {
  const pickerW = 0, gap = 0, margin = 48;
  const s = Math.max(.46, Math.min(1, (innerHeight - margin) / 874, (innerWidth - margin) / 402));
  const groupW = 402 * s;
  const groupLeft = (innerWidth - groupW) / 2;
  const phone = document.getElementById("phone");
  phone.style.left = groupLeft + 201 * s + "px";
  phone.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

show(0);
