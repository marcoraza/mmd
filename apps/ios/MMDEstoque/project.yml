name: MMDEstoque

options:
  bundleIdPrefix: com.emdash
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  ZebraRFID:
    url: https://github.com/ZebraDevs/alt-rfid-ios-sdk
    branch: main

targets:
  MMDEstoque:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
    sources:
      - MMDEstoque
    resources:
      - path: MMDEstoque/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emdash.mmdestoque
        PRODUCT_NAME: "MMD Estoque"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: MMDEstoque/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - sdk: ExternalAccessory.framework
      - sdk: CoreBluetooth.framework
      - package: ZebraRFID
        product: Zebra123RFIDsdkSPM

  MMDEstoqueTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
    sources:
      - MMDEstoqueTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emdash.mmdestoque.tests
        PRODUCT_NAME: "MMDEstoqueTests"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MMD Estoque.app/MMD Estoque"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MMDEstoque

schemes:
  MMDEstoque:
    build:
      targets:
        MMDEstoque: all
        MMDEstoqueTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MMDEstoqueTests
